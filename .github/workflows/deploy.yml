name: Deploy website

on:
  push:
    branches:
      - main
      - arena/8fa9f243-mir
  workflow_dispatch:

concurrency:
  group: website-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          FTP_PORT: ${{ vars.FTP_PORT }}
        run: python3 .github/scripts/deploy_ftp.py
